[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "regguard-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.20", "pymupdf>=1.25,<2", "python-docx>=1.1,<2",
  "openai>=2,<3", "rfc8785>=0.1.4,<1", "pyyaml>=6,<7", "reportlab>=4.3,<5",
  "eth-account>=0.13,<1", "eth-abi>=5,<6"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "respx>=0.22,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.setuptools.package-data]
app = ["assets/fonts/*"]
